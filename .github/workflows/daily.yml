name: Job hunt (every 3 hours)

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours
  workflow_dispatch: {}      # "Run workflow" button for a manual run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python jobs_bot.py
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && exit 0
          git commit -m "jobs $(date -u +%F-%H%M)"
          # the website may have saved an "Applied" click meanwhile -> merge it in
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
